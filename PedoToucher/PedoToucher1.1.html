<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Pedo Toucher 1.1</title>
	<style>
		html,body { height:100%; margin:0; }
		body {
			background: linear-gradient(#87CEEB,#f6f1d3);
			background-image: url('nice-island.jpg');
			background-size: cover;
			background-position: center;
			overflow:hidden;
			font-family: Arial, Helvetica, sans-serif;
		}
		#stage {
			position:relative;
			width:100vw;
			height:100vh;
			overflow:hidden;
		}
		.face-link {
			position:absolute;
			display:none; /* Hide all by default */
			width:250px;
			height:250px;
			border-radius:12px;
			box-shadow: 0 8px 18px rgba(0,0,0,0.35);
			overflow:hidden;
			user-select:none;
			-webkit-user-drag:none;
            cursor: pointer;
		}
		.face-link img { width:100%; height:100%; object-fit:cover; display:block; }
	</style>
</head>
<body>
	<h2><center>Touch the pedophiles before they touch you!</center></h2>
	<div id="stage">
		<a href="#" class="face-link" id="link1"><img src="donald.jpg" alt="Trump"></a>
		<a href="#" class="face-link" id="link2"><img src="bill.jpg" alt="Clinton"></a>
		<a href="#" class="face-link" id="link3"><img src="jeff.jpg" alt="Epstein"></a>
		<a href="#" class="face-link" id="link4"><img src="dean.jpg" alt="Kamen"></a>
		<a href="#" class="face-link" id="link5"><img src="stephen.jpg" alt="Stephen"></a>
	</div>
	<script>
		const stage = document.getElementById('stage');
		const elems = Array.from(document.querySelectorAll('.face-link'));
		
		let currentIndex = 0;
		let activeState = null;

		// Function to spawn the current image at a random location
		function spawnCurrent() {
			// Hide the previous one if it exists
			if (activeState && activeState.el) {
				activeState.el.style.display = 'none';
			}

			// Get the new element and show it
			const el = elems[currentIndex];
			el.style.display = 'block';

			const w = el.clientWidth || 250;
			const h = el.clientHeight || 250;
			
            // Randomize position
			const x = Math.random() * Math.max(0, stage.clientWidth - w);
			const y = Math.random() * Math.max(0, stage.clientHeight - h);
			
            // Randomize velocity
			const speed = 10 + Math.random() * 30;
			const angle = Math.random() * Math.PI * 2;
			const dx = Math.cos(angle) * speed;
			const dy = Math.sin(angle) * speed;
			
			el.style.left = x + 'px';
			el.style.top = y + 'px';
			
            // Update the global state
			activeState = { el, x, y, dx, dy, w, h };
		}

		// Add click listeners to cycle through images
		elems.forEach((el) => {
			el.addEventListener('click', (e) => {
				e.preventDefault(); // Prevent link jump
				currentIndex++;
				if (currentIndex >= elems.length) {
					currentIndex = 0; // Loop back to the beginning
				}
				spawnCurrent();
			});
		});

		// Small additive value to shift direction
		function getKick() {
			return (Math.random() - 0.5) * 0.8; 
		}

		function step() {
			if (!activeState) {
				requestAnimationFrame(step);
				return;
			}

			const W = stage.clientWidth;
			const H = stage.clientHeight;
			const s = activeState;

			s.x += s.dx;
			s.y += s.dy;

			// Bounce off left/right
			if (s.x <= 0) { 
				s.x = 0; 
				s.dx = Math.abs(s.dx) + 0.1; 
				s.dy += getKick();           
			}
			else if (s.x + s.w >= W) { 
				s.x = W - s.w; 
				s.dx = -Math.abs(s.dx) - 0.1; 
				s.dy += getKick();
			}

			// Bounce off top/bottom
			if (s.y <= 0) { 
				s.y = 0; 
				s.dy = Math.abs(s.dy) + 0.1; 
				s.dx += getKick();           
			}
			else if (s.y + s.h >= H) { 
				s.y = H - s.h; 
				s.dy = -Math.abs(s.dy) - 0.1; 
				s.dx += getKick();
			}

			// Anti-Stuck Logic
			if (Math.abs(s.dx) < 0.5) s.dx = (s.dx < 0 ? -1 : 1) * (1 + Math.random());
			if (Math.abs(s.dy) < 0.5) s.dy = (s.dy < 0 ? -1 : 1) * (1 + Math.random());

			// Speed Cap
			const maxSpeed = 50;
			if (Math.abs(s.dx) > maxSpeed) s.dx *= 0.9;
			if (Math.abs(s.dy) > maxSpeed) s.dy *= 0.9;
			const minSpeed = 10;
			if (Math.abs(s.dx) < minSpeed) s.dx = (s.dx < 0 ? -1 : 1) * minSpeed;
			if (Math.abs(s.dy) < minSpeed) s.dy = (s.dy < 0 ? -1 : 1) * minSpeed;

			s.el.style.left = Math.round(s.x) + 'px';
			s.el.style.top = Math.round(s.y) + 'px';

			requestAnimationFrame(step);
		}

		// Keep it in bounds if the window resizes
		window.addEventListener('resize', () => {
			if (!activeState) return;
			const W = stage.clientWidth, H = stage.clientHeight;
			const s = activeState;
			if (s.x + s.w > W) s.x = Math.max(0, W - s.w);
			if (s.y + s.h > H) s.y = Math.max(0, H - s.h);
		});

		document.querySelectorAll('img').forEach(i => i.ondragstart = () => false);

		// Initialize the first image and start the loop
		spawnCurrent();
		requestAnimationFrame(step);
	</script>
</body>
</html>
