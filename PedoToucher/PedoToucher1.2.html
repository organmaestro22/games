<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Pedo Toucher 1.2</title>
	<style>
		html, body { 
			height: 100%; 
			margin: 0; 
			overflow: hidden;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}
		body {
			background: linear-gradient(#87CEEB, #f6f1d3);
			background-image: url('nice-island.jpg');
			background-size: cover;
			background-position: center;
		}
		#hud {
			position: absolute;
			top: 20px;
			left: 0;
			right: 0;
			display: flex;
			justify-content: space-around;
			pointer-events: none;
			z-index: 100;
			color: white;
			text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
		}
		.stat-box { font-size: 24px; font-weight: bold; }
		#stage {
			position: relative;
			width: 100vw;
			height: 100vh;
		}
		.face-link {
			position: absolute;
			display: none;
			width: 200px; /* Slightly smaller for higher difficulty */
			height: 200px;
			border-radius: 50%; /* Circular for a more game-like feel */
			box-shadow: 0 8px 18px rgba(0,0,0,0.4);
			border: 4px solid white;
			overflow: hidden;
			user-select: none;
			cursor: crosshair;
			transition: transform 0.1s;
		}
		.face-link:active { transform: scale(0.9); }
		.face-link img { width: 100%; height: 100%; object-fit: cover; }
	</style>
</head>
<body>
	<h3><center>Touch the pedophiles before they touch you!</center></h3>
	<div id="hud">
		<div class="stat-box">Level: <span id="level-val">1</span></div>
		<div class="stat-box">Score: <span id="score-val">0</span></div>
	</div>

	<div id="stage">
		<a href="#" class="face-link" id="link1"><img src="donald.jpg" alt="Trump"></a>
		<a href="#" class="face-link" id="link2"><img src="bill.jpg" alt="Clinton"></a>
		<a href="#" class="face-link" id="link3"><img src="jeff.jpg" alt="Epstein"></a>
		<a href="#" class="face-link" id="link4"><img src="dean.jpg" alt="Kamen"></a>
		<a href="#" class="face-link" id="link5"><img src="stephen.jpg" alt="Stephen"></a>
	</div>

	<script>
		const stage = document.getElementById('stage');
		const scoreEl = document.getElementById('score-val');
		const levelEl = document.getElementById('level-val');
		const elems = Array.from(document.querySelectorAll('.face-link'));
		
		let currentIndex = 0;
		let activeState = null;
		let score = 0;
		let level = 1;
		let speedMultiplier = 1.0;

		function spawnCurrent() {
			if (activeState && activeState.el) {
				activeState.el.style.display = 'none';
			}

			const el = elems[currentIndex];
			el.style.display = 'block';

			const w = 200;
			const h = 200;
			
			const x = Math.random() * Math.max(0, stage.clientWidth - w);
			const y = Math.random() * Math.max(0, stage.clientHeight - h);
			
			// Base speed modified by current level multiplier
			const baseSpeed = (5) * speedMultiplier;
			const angle = Math.random() * Math.PI * 2;
			
			activeState = { 
				el, 
				x, y, 
				dx: Math.cos(angle) * baseSpeed, 
				dy: Math.sin(angle) * baseSpeed, 
				w, h 
			};
		}

		elems.forEach((el) => {
			el.addEventListener('click', (e) => {
				e.preventDefault();
				
				// Update Score
				score += (10 * level);
				scoreEl.innerText = score;

				currentIndex++;
				
				// Check for Level Up
				if (currentIndex >= elems.length) {
					currentIndex = 0;
					level++;
					speedMultiplier += 0.5; // Increase speed by 20% each level
					levelEl.innerText = level;
					levelEl.style.color = "#FFD700"; // Visual flash for level up
					setTimeout(() => levelEl.style.color = "white", 500);
				}
				
				spawnCurrent();
			});
		});

		function getKick() {
			return (Math.random() - 0.5) * (0.8 * speedMultiplier); 
		}

		function step() {
			if (!activeState) {
				requestAnimationFrame(step);
				return;
			}

			const W = stage.clientWidth;
			const H = stage.clientHeight;
			const s = activeState;

			s.x += s.dx;
			s.y += s.dy;

			if (s.x <= 0) { 
				s.x = 0; 
				s.dx = Math.abs(s.dx) + 0.1; 
				s.dy += getKick();           
			} else if (s.x + s.w >= W) { 
				s.x = W - s.w; 
				s.dx = -Math.abs(s.dx) - 0.1; 
				s.dy += getKick();
			}

			if (s.y <= 0) { 
				s.y = 0; 
				s.dy = Math.abs(s.dy) + 0.1; 
				s.dx += getKick();           
			} else if (s.y + s.h >= H) { 
				s.y = H - s.h; 
				s.dy = -Math.abs(s.dy) - 0.1; 
				s.dx += getKick();
			}

			s.el.style.left = Math.round(s.x) + 'px';
			s.el.style.top = Math.round(s.y) + 'px';

			requestAnimationFrame(step);
		}

		window.addEventListener('resize', () => {
			if (!activeState) return;
			const W = stage.clientWidth, H = stage.clientHeight;
			const s = activeState;
			if (s.x + s.w > W) s.x = Math.max(0, W - s.w);
			if (s.y + s.h > H) s.y = Math.max(0, H - s.h);
		});

		document.querySelectorAll('img').forEach(i => i.ondragstart = () => false);

		spawnCurrent();
		requestAnimationFrame(step);
	</script>
</body>
</html>
