<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Great American Heros</title>
	<style>
		html,body { height:100%; margin:0; }
		body {
			background: linear-gradient(#87CEEB,#f6f1d3);
			background-image: url('nice-island.jpg');
			background-size: cover;
			background-position: center;
			overflow:hidden;
			font-family: Arial, Helvetica, sans-serif;
		}
		#stage {
			position:relative;
			width:100vw;
			height:100vh;
			overflow:hidden;
		}
		.face-link {
			position:absolute;
			display:block;
			width:250px;
			height:250px;
			border-radius:12px;
			box-shadow: 0 8px 18px rgba(0,0,0,0.35);
			overflow:hidden;
			user-select:none;
			-webkit-user-drag:none;
		}
		.face-link img { width:100%; height:100%; object-fit:cover; display:block; }
	</style>
</head>
<body>
	<div id="stage">
		<a href="#" class="face-link" id="link1"><img src="donald.jpg" alt="Trump"></a>
		<a href="#" class="face-link" id="link2"><img src="bill.jpg" alt="Clinton"></a>
		<a href="#" class="face-link" id="link3"><img src="jeff.jpg" alt="Epstein"></a>
		<a href="#" class="face-link" id="link4"><img src="dean.jpg" alt="Kamen"></a>
	</div>
	<script>
		const stage = document.getElementById('stage');
		const elems = Array.from(document.querySelectorAll('.face-link'));

		const state = elems.map((el) => {
			const w = el.clientWidth || 250, h = el.clientHeight || 250;
			const x = Math.random() * Math.max(0, stage.clientWidth - w);
			const y = Math.random() * Math.max(0, stage.clientHeight - h);
			
			const speed = 10 + Math.random() * 40;
			const angle = Math.random() * Math.PI * 2;
			const dx = Math.cos(angle) * speed;
			const dy = Math.sin(angle) * speed;
			
			el.style.left = x + 'px';
			el.style.top = y + 'px';
			return {el, x, y, dx, dy, w, h};
		});

		// Small additive value to shift direction
		function getKick() {
			return (Math.random() - 0.4) * 0.8; 
		}

		function step() {
			const W = stage.clientWidth;
			const H = stage.clientHeight;

			for (const s of state) {
				s.x += s.dx;
				s.y += s.dy;

				// Bounce off left/right
				if (s.x <= 0) { 
					s.x = 0; 
					s.dx = Math.abs(s.dx) + 0.1; // Ensure it moves right
					s.dy += getKick();           // Additive shift to vertical
				}
				else if (s.x + s.w >= W) { 
					s.x = W - s.w; 
					s.dx = -Math.abs(s.dx) - 0.1; // Ensure it moves left
					s.dy += getKick();
				}

				// Bounce off top/bottom
				if (s.y <= 0) { 
					s.y = 0; 
					s.dy = Math.abs(s.dy) + 0.1; // Ensure it moves down
					s.dx += getKick();           // Additive shift to horizontal
				}
				else if (s.y + s.h >= H) { 
					s.y = H - s.h; 
					s.dy = -Math.abs(s.dy) - 0.1; // Ensure it moves up
					s.dx += getKick();
				}

				// Anti-Stuck Logic: If horizontal or vertical velocity is too low, give it a nudge
				if (Math.abs(s.dx) < 0.5) s.dx = (s.dx < 0 ? -1 : 1) * (1 + Math.random());
				if (Math.abs(s.dy) < 0.5) s.dy = (s.dy < 0 ? -1 : 1) * (1 + Math.random());

				// Speed Cap (keeps things from getting too wild)
				const maxSpeed = 50;
				if (Math.abs(s.dx) > maxSpeed) s.dx *= 0.9;
				if (Math.abs(s.dy) > maxSpeed) s.dy *= 0.9;
				const minSpeed = 10;
				if (Math.abs(s.dx) < minSpeed) s.dx = (s.dx < 0 ? -1 : 1) * minSpeed;
				if (Math.abs(s.dy) < minSpeed) s.dy = (s.dy < 0 ? -1 : 1) * minSpeed;

				s.el.style.left = Math.round(s.x) + 'px';
				s.el.style.top = Math.round(s.y) + 'px';
			}
			requestAnimationFrame(step);
		}

		window.addEventListener('resize', () => {
			const W = stage.clientWidth, H = stage.clientHeight;
			for (const s of state) {
				if (s.x + s.w > W) s.x = Math.max(0, W - s.w);
				if (s.y + s.h > H) s.y = Math.max(0, H - s.h);
			}
		});

		document.querySelectorAll('img').forEach(i => i.ondragstart = () => false);

		requestAnimationFrame(step);
	</script>
</body>
</html>
