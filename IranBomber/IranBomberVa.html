<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Strike: Combat Operations</title>
    <style>
        body { 
            margin: 0; background: #d1d1d1; color: #333; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; user-select: none;
        }
        #gameWrapper { position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 6px solid #fff; border-radius: 4px; }
        canvas { background: #cfd8dc; display: block; cursor: crosshair; }

        #welcomeScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; text-align: center; padding: 40px; box-sizing: border-box;
        }
        .btn-start {
            padding: 15px 40px; font-size: 1.5rem; font-weight: bold;
            background: #263238; color: white; border: none; border-radius: 8px;
            cursor: pointer; transition: transform 0.1s; margin-top: 20px;
        }
        .btn-start:hover { background: #455a64; transform: scale(1.05); }
        
        .controls-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
            background: #eceff1; padding: 20px; border-radius: 12px; margin: 20px 0;
            text-align: left; font-size: 0.9rem;
        }
        .key { font-weight: bold; color: #d32f2f; }
    </style>
</head>
<body>

<div id="gameWrapper">
    <canvas id="gameCanvas"></canvas>

    <div id="welcomeScreen">
        <h1 style="margin-bottom:10px; color: #263238;">CITY STRIKE: ESCALATION</h1>
        <p>Start with bombing runs. Prepare for the airspace to become hostile.</p>
        
        <div class="controls-grid">
            <div><span class="key">A / D</span>: Maneuver</div>
            <div><span class="key">SPACE</span>: Drop Bomb</div>
            <div><span class="key">S</span>: 20mm Vulcan</div>
            <div><span class="key">E</span>: AIM-9 Sidewinder</div>
            <div><span class="key">SHIFT</span>: Tactical Dash</div>
            <div><span class="key">P</span>: Dev Mode</div>
        </div>

        <button class="btn-start" onclick="startGame()">INITIATE STRIKE</button>
    </div>
</div>

<script>
const CONFIG = {
    canvasWidth: 800, canvasHeight: 850,
    scrollSpeed: 4.5, planeSideSpeed: 9,
    dashMultiplier: 2.5, dashDuration: 180, dashCooldown: 1500,
    planeY: 250,
    
    // Weapon Stats
    bombCooldown: 800, bombFallDuration: 45, bombForwardSpeed: 3.5, 
    visualBlastRadius: 110, hitBuffer: 1.3,
    
    gunHeatPerShot: 1.5, gunCoolRate: 0.85, gunFireRate: 3, 
    missileCooldown: 4000,
    
    perspectiveStrength: 0.1, buildingProb: 0.25, carProb: 0.5,
    
    targetTypes: [
        { name: "NRC", color: "#81d4fa", sideColor: "#4fc3f7", maxPoints: 100, weight: 60, baseHeight: 70 },
        { name: "Gov Bld.", color: "#ffab91", sideColor: "#ff8a65", maxPoints: 400, weight: 30, baseHeight: 120 },
        { name: "Orphanage", color: "#9575cd", sideColor: "#7986cb", maxPoints: 8000, weight: 1, baseHeight: 50 }
    ],
    carPoints: 200
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const welcomeScreen = document.getElementById('welcomeScreen');
canvas.width = CONFIG.canvasWidth; canvas.height = CONFIG.canvasHeight;

let gameRunning = false, devMode = false, score = 0, phase = 1, phaseName = "CLEAR SKIES";
let lastBombTime = 0, lastMissileTime = 0, lastGunFire = 0, gunHeat = 0, gunOverheated = false;
let buildings = [], cars = [], bombs = [], explosions = [], popups = [], enemies = [], projectiles = [], playerBullets = [], playerMissiles = [];
let keys = {}, frameCount = 0, lastSpawnFrame = 0;

const plane = { x: canvas.width / 2 - 30, y: canvas.height - CONFIG.planeY, w: 60, h: 80, dashTimer: 0, lastDash: 0 };

function startGame() { 
    welcomeScreen.style.display = 'none'; gameRunning = true; score = 0; phase = 1; 
    enemies = []; projectiles = []; buildings = []; cars = []; gunHeat = 0; gunOverheated = false; 
}

function updatePhase() {
    if (score >= 20000) { phase = 5; phaseName = "TOTAL WAR"; }
    else if (score >= 12000) { phase = 4; phaseName = "ACE TIER"; }
    else if (score >= 6000) { phase = 3; phaseName = "DOGFIGHT"; }
    else if (score >= 2000) { phase = 2; phaseName = "AIRSPACE CONTESTED"; }
    else { phase = 1; phaseName = "CLEAR SKIES"; }
}

function spawnEnemy(type) {
    let startX = Math.random() * (canvas.width - 150) + 75;
    let enemy = { type: type, x: startX, y: -160, lastFire: 0, wobble: Math.random() * 100, isAircraft: true };

    switch(type) {
        case 'sam': 
            enemy.w = 20; enemy.h = 60; enemy.speed = 8.5; enemy.health = 2; enemy.isAircraft = false; break;
        case 'drone': 
            enemy.w = 40; enemy.h = 40; enemy.speed = 4; enemy.health = 2; break;
        case 'fighter': 
            enemy.w = 50; enemy.h = 60; enemy.speed = 5.5; enemy.health = 4; break;
        case 'ace': 
            enemy.w = 45; enemy.h = 65; enemy.speed = 6.5; enemy.health = 10; break;
        case 'titan': 
            enemy.w = 180; enemy.h = 80; enemy.speed = 1.2; enemy.health = 35; break;
    }
    enemies.push(enemy);
    lastSpawnFrame = frameCount;
}

function spawnLogic() {
    // Environment Spawning (Always active)
    if (frameCount % 60 === 0) {
        const lanes = [40, 160, 280, 400, 520, 640];
        lanes.forEach(x => {
            if (Math.random() > 1 - CONFIG.buildingProb) {
                const totalWeight = CONFIG.targetTypes.reduce((sum, type) => sum + type.weight, 0);
                let random = Math.random() * totalWeight, selectedType = CONFIG.targetTypes[0];
                for (let i = 0; i < CONFIG.targetTypes.length; i++) {
                    if (random < CONFIG.targetTypes[i].weight) { selectedType = CONFIG.targetTypes[i]; break; }
                    random -= CONFIG.targetTypes[i].weight;
                }
                buildings.push({ ...selectedType, x: x + (Math.random() * 30), y: -500, w: 90, h: 90, currentHeight: selectedType.baseHeight * (0.8 + Math.random() * 0.4), targetHeight: null, health: 1.0, isDamaged: false });
            }
        });
        const roadX = [115, 235, 355, 475, 595, 715];
        roadX.forEach(x => {
            if (Math.random() > 1 - CONFIG.carProb) {
                cars.push({ x: x - 10, y: -50, w: 20, h: 35, color: ['#e91e63', '#ffeb3b', '#2196f3', '#4caf50'][Math.floor(Math.random()*4)], speed: 3 + Math.random() * 4, destroyed: false });
            }
        });
    }

    if (phase === 1) return; // No enemies in Phase 1

    let minSpawnInterval = 100 - (phase * 10);
    let maxEnemies = phase + 2;

    if (enemies.length < maxEnemies && (frameCount - lastSpawnFrame) > minSpawnInterval) {
        let r = Math.random() * 100;
        if (phase === 2) {
            r < 60 ? spawnEnemy('drone') : spawnEnemy('sam');
        } else if (phase === 3) {
            if (r < 30) spawnEnemy('sam');
            else if (r < 60) spawnEnemy('drone');
            else spawnEnemy('fighter');
        } else if (phase === 4) {
            if (r < 20) spawnEnemy('sam');
            else if (r < 50) spawnEnemy('fighter');
            else spawnEnemy('ace');
        } else if (phase === 5) {
            if (r < 15 && enemies.filter(e => e.type === 'titan').length === 0) spawnEnemy('titan');
            else if (r < 40) spawnEnemy('ace');
            else if (r < 70) spawnEnemy('fighter');
            else spawnEnemy('sam');
        }
    }
}

function update() {
    if (!gameRunning) return;
    frameCount++; const now = Date.now();
    updatePhase();

    // Movement
    let currentSpeed = CONFIG.planeSideSpeed;
    if ((keys['ShiftLeft'] || keys['ShiftRight']) && now - plane.lastDash > CONFIG.dashCooldown) {
        plane.dashTimer = CONFIG.dashDuration; plane.lastDash = now;
    }
    if (plane.dashTimer > 0) { currentSpeed *= CONFIG.dashMultiplier; plane.dashTimer -= 16; }
    if (keys['ArrowLeft'] || keys['KeyA']) plane.x = Math.max(0, plane.x - currentSpeed);
    if (keys['ArrowRight'] || keys['KeyD']) plane.x = Math.min(canvas.width - plane.w, plane.x + currentSpeed);

    // Weapons
    if (keys['KeyS'] && !gunOverheated) {
        if (frameCount - lastGunFire >= CONFIG.gunFireRate) {
            gunHeat += CONFIG.gunHeatPerShot;
            playerBullets.push({ x: plane.x + plane.w/2 - 6, y: plane.y, vy: -25 });
            playerBullets.push({ x: plane.x + plane.w/2 + 2, y: plane.y, vy: -25 });
            lastGunFire = frameCount;
        }
        if (gunHeat >= 100) { gunHeat = 100; gunOverheated = true; }
    } else {
        gunHeat = Math.max(0, gunHeat - CONFIG.gunCoolRate);
        if (gunHeat === 0) gunOverheated = false;
    }

    if (keys['KeyE'] && now - lastMissileTime > CONFIG.missileCooldown) {
        playerMissiles.push({ x: plane.x + plane.w/2, y: plane.y, vx: 0, vy: -4, target: null, life: 180 });
        lastMissileTime = now;
    }

    if (keys['Space'] && now - lastBombTime > CONFIG.bombCooldown) {
        bombs.push({ x: plane.x + plane.w/2, y: plane.y, timer: CONFIG.bombFallDuration, vy: -CONFIG.bombForwardSpeed });
        lastBombTime = now;
    }

    spawnLogic();

    // Environment
    buildings.forEach((b, i) => {
        b.y += CONFIG.scrollSpeed;
        if (b.targetHeight !== null && b.currentHeight > b.targetHeight) b.currentHeight -= 5; 
        if (b.y > canvas.height + 500) buildings.splice(i, 1);
    });
    cars.forEach((c, i) => {
        c.y += CONFIG.scrollSpeed + (c.destroyed ? 0 : c.speed);
        if (c.y > canvas.height + 50) cars.splice(i, 1);
    });

    // Bullets vs Enemies
    playerBullets.forEach((b, i) => {
        b.y += b.vy; let hit = false;
        enemies.forEach((en, ei) => {
            if (hit) return;
            let hw = en.isAircraft ? en.w : en.w * 0.8, hx = en.isAircraft ? en.x : en.x + en.w*0.1;
            if (b.x > hx && b.x < hx + hw && b.y > en.y && b.y < en.y + en.h) {
                en.health--; playerBullets.splice(i, 1); hit = true;
                if (en.health <= 0) {
                    let pts = en.type === 'titan' ? 5000 : (en.type === 'ace' ? 1200 : 500);
                    score += pts; popups.push({ x: en.x + en.w/2, y: en.y, text: `+${pts}`, life: 35, color: "#263238" });
                    explosions.push({ x: en.x + en.w/2, y: en.y + en.h/2, currentR: 0, r: en.type === 'titan' ? 100 : 40, life: 20 });
                    enemies.splice(ei, 1);
                }
            }
        });
        if (!hit && b.y < -50) playerBullets.splice(i, 1);
    });

    // Missiles
    playerMissiles.forEach((m, i) => {
        m.life--;
        if (!m.target || !enemies.includes(m.target)) {
            let closest = null, minDist = 1500;
            enemies.forEach(en => {
                if (en.isAircraft) {
                    let d = Math.sqrt((m.x - en.x)**2 + (m.y - en.y)**2);
                    if (d < minDist) { minDist = d; closest = en; }
                }
            });
            m.target = closest;
        }
        if (m.target) {
            let angle = Math.atan2(m.target.y + m.target.h/2 - m.y, m.target.x + m.target.w/2 - m.x);
            m.vx += Math.cos(angle) * 1.5; m.vy += Math.sin(angle) * 1.5;
            let speed = Math.sqrt(m.vx**2 + m.vy**2);
            if (speed > 18) { m.vx = (m.vx/speed)*18; m.vy = (m.vy/speed)*18; }
        } else m.vy -= 0.3;
        
        m.x += m.vx; m.y += m.vy;
        
        enemies.forEach((en, ei) => {
            if (Math.sqrt((m.x - (en.x + en.w/2))**2 + (m.y - (en.y + en.h/2))**2) < 40) {
                explosions.push({ x: m.x, y: m.y, currentR: 0, r: 80, life: 25 });
                en.health -= 20; 
                playerMissiles.splice(i, 1);
                if (en.health <= 0) { 
                    score += 2000; popups.push({ x: en.x + en.w/2, y: en.y, text: `+2000`, life: 35, color: "#fff" });
                    enemies.splice(ei, 1); 
                }
            }
        });
        if (m.life <= 0 || m.y < -100) playerMissiles.splice(i, 1);
    });

    // Enemy AI & Projectiles
    enemies.forEach((en, i) => {
        en.y += en.speed;
        
        if (en.type === 'drone') {
            en.x += Math.sin(frameCount * 0.05 + en.wobble) * 4;
        } else if (en.type === 'fighter') {
            en.x += (plane.x + plane.w/2 - (en.x + en.w/2)) * 0.03; // Try to track horizontally
            if (en.y > 50 && now - en.lastFire > 1500 && Math.abs(en.x - plane.x) < 100) {
                projectiles.push({ x: en.x + en.w/2, y: en.y + en.h, vx: 0, vy: 10, r: 5, color: "#ff1744" });
                en.lastFire = now;
            }
        } else if (en.type === 'ace') {
            en.x += Math.sin(frameCount * 0.08 + en.wobble) * 6; // Aggressive evasive
            en.x += (plane.x + plane.w/2 - (en.x + en.w/2)) * 0.04;
            if (en.y > 0 && now - en.lastFire > 1000) {
                let angle = Math.atan2(plane.y - en.y, (plane.x + plane.w/2) - (en.x + en.w/2));
                projectiles.push({ x: en.x + en.w/2, y: en.y + en.h, vx: Math.cos(angle) * 12, vy: Math.sin(angle) * 12, r: 6, color: "#d50000" });
                en.lastFire = now;
            }
        } else if (en.type === 'sam') {
            en.x += Math.sin((frameCount + en.wobble) * 0.1) * 1.5;
        } else if (en.type === 'titan') {
            if (now - en.lastFire > 2500 && en.y > 50) {
                for(let o = 0; o < Math.PI * 2; o += Math.PI/6) {
                    projectiles.push({ x: en.x + en.w/2, y: en.y + en.h/2, vx: Math.cos(o) * 6, vy: Math.sin(o) * 6 + 3, r: 8, color: "#ffeb3b" });
                }
                en.lastFire = now;
            }
        }

        if (en.y > canvas.height + 200) enemies.splice(i, 1);
        if (en.x < plane.x + plane.w - 15 && en.x + en.w > plane.x + 15 && en.y < plane.y + plane.h - 15 && en.y + en.h > plane.y + 15) gameOver();
    });

    projectiles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < plane.x + plane.w - 18 && p.x + p.r > plane.x + 18 && p.y < plane.y + plane.h - 18 && p.y + p.r > plane.y + 18) gameOver();
        if (p.y > canvas.height + 100 || p.x < -100 || p.x > canvas.width + 100) projectiles.splice(i, 1);
    });

    // Bomb Physics & Destruction
    bombs.forEach((bomb, i) => {
        bomb.timer--; bomb.y += bomb.vy;
        if (bomb.timer <= 0) {
            const bc = { x: bomb.x, y: bomb.y };
            explosions.push({ ...bc, currentR: 0, r: CONFIG.visualBlastRadius, life: 25 });
            const effR = CONFIG.visualBlastRadius * CONFIG.hitBuffer;

            enemies.forEach((en, idx) => {
                if (!en.isAircraft && Math.sqrt((bc.x - (en.x + en.w/2))**2 + (bc.y - (en.y + en.h/2))**2) < effR) {
                    en.health -= 5;
                    if (en.health <= 0) {
                        score += 500; popups.push({ x: en.x + en.w/2, y: en.y, text: `+500`, life: 45, color: "#ff1744" });
                        enemies.splice(idx, 1);
                    }
                }
            });
            buildings.forEach(b => {
                const dist = Math.sqrt((bc.x - (b.x + b.w/2))**2 + (bc.y - (b.y + b.h/2))**2);
                if (dist < effR && b.health > 0) {
                    b.health -= dist < effR * 0.5 ? 1.0 : 0.5;
                    let pts = Math.round(b.maxPoints * (dist < effR * 0.5 ? 1.0 : 0.5));
                    score += pts; popups.push({ x: b.x + b.w/2, y: b.y, text: `+${pts}`, life: 45, color: b.health <= 0 ? "#ff1744" : "#ff9100" });
                    if (b.health <= 0) { b.targetHeight = 0; b.isDamaged = true; } else { b.targetHeight = b.currentHeight * 0.4; b.isDamaged = true; }
                }
            });
            cars.forEach(c => {
                if (Math.sqrt((bc.x - (c.x + c.w/2))**2 + (bc.y - (c.y + c.h/2))**2) < effR && !c.destroyed) {
                    c.destroyed = true; score += CONFIG.carPoints;
                    popups.push({ x: c.x + c.w/2, y: c.y, text: `+${CONFIG.carPoints}`, life: 35, color: "#ffee58" });
                }
            });
            bombs.splice(i, 1);
        }
    });

    explosions.forEach((e, i) => { e.life--; if (e.currentR < e.r) e.currentR += (e.r - e.currentR) * 0.35; if (e.life <= 0) explosions.splice(i, 1); });
    popups.forEach((p, i) => { p.life--; p.y -= 1.4; if (p.life <= 0) popups.splice(i, 1); });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#cfd8dc"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Grid & Road
    ctx.fillStyle = "#b0bec5";
    for(let i=1; i<7; i++) ctx.fillRect(i * 120 - 5, 0, 10, canvas.height);
    let roadOff = (frameCount * CONFIG.scrollSpeed) % 200;
    for(let i=-1; i<6; i++) ctx.fillRect(0, i * 200 + roadOff, canvas.width, 35);

    cars.forEach(c => { 
        ctx.fillStyle = c.destroyed ? "#455a64" : c.color; 
        ctx.fillRect(c.x, c.y, c.w, c.h);
        if(!c.destroyed) {
            ctx.fillStyle = "rgba(255,255,255,0.5)";
            ctx.fillRect(c.x + 2, c.y + 6, c.w - 4, 8);
            ctx.fillRect(c.x + 2, c.y + 22, c.w - 4, 4);
        }
    });

    // 3D Buildings
    buildings.forEach(b => {
        const cX = canvas.width/2, cY = canvas.height/2;
        let rOX = (b.x + b.w/2 - cX) * CONFIG.perspectiveStrength;
        let rOY = (b.y + b.h/2 - cY) * CONFIG.perspectiveStrength;
        let rX = b.x + rOX, rY = b.y + rOY - (Math.max(0, b.currentHeight) * 0.2);
        ctx.fillStyle = b.isDamaged ? "#263238" : b.sideColor;
        if (b.currentHeight > 1) {
            ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x+b.w, b.y); ctx.lineTo(rX+b.w, rY); ctx.lineTo(rX, rY); ctx.fill();
            ctx.beginPath(); ctx.moveTo(b.x, b.y+b.h); ctx.lineTo(b.x+b.w, b.y+b.h); ctx.lineTo(rX+b.w, rY+b.h); ctx.lineTo(rX, rY+b.h); ctx.fill();
            ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(rX, rY); ctx.lineTo(rX, rY+b.h); ctx.lineTo(b.x, b.y+b.h); ctx.fill();
            ctx.beginPath(); ctx.moveTo(b.x+b.w, b.y); ctx.lineTo(rX+b.w, rY); ctx.lineTo(rX+b.w, rY+b.h); ctx.lineTo(b.x+b.w, b.y+b.h); ctx.fill();
            ctx.fillStyle = b.isDamaged ? "#455a64" : b.color; ctx.fillRect(rX, rY, b.w, b.h);
        } else { ctx.fillStyle = "#37474f"; ctx.fillRect(b.x, b.y, b.w, b.h); }
    });

    // Weapons
    playerBullets.forEach(b => { ctx.fillStyle = "#ffeb3b"; ctx.fillRect(b.x, b.y, 4, 18); });
    playerMissiles.forEach(m => {
        ctx.fillStyle = "#fff"; ctx.fillRect(m.x-3, m.y, 6, 25);
        ctx.fillStyle = "#f44336"; ctx.beginPath(); ctx.moveTo(m.x-3, m.y); ctx.lineTo(m.x, m.y-10); ctx.lineTo(m.x+3, m.y); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.beginPath(); ctx.arc(m.x, m.y+25, 6, 0, Math.PI*2); ctx.fill();
    });

    // Enemies
    enemies.forEach(en => {
        if (en.type === 'titan') {
            ctx.fillStyle = "#263238"; ctx.fillRect(en.x, en.y, en.w, en.h);
            ctx.fillStyle = "#455a64"; ctx.fillRect(en.x + 10, en.y + 10, en.w - 20, en.h - 20);
            ctx.fillStyle = "#ff5722"; ctx.fillRect(en.x + en.w/2 - 10, en.y + en.h - 15, 20, 10);
        } else if (en.type === 'ace') {
            ctx.fillStyle = "#d50000"; ctx.beginPath(); ctx.moveTo(en.x + en.w/2, en.y + en.h); ctx.lineTo(en.x, en.y); ctx.lineTo(en.x + en.w, en.y); ctx.fill();
            ctx.fillStyle = "#b71c1c"; ctx.fillRect(en.x + en.w/2 - 6, en.y - 10, 12, en.h + 10);
        } else if (en.type === 'fighter') {
            ctx.fillStyle = "#1e88e5"; ctx.beginPath(); ctx.moveTo(en.x + en.w/2, en.y + en.h); ctx.lineTo(en.x, en.y); ctx.lineTo(en.x + en.w, en.y); ctx.fill();
            ctx.fillStyle = "#0d47a1"; ctx.fillRect(en.x + en.w/2 - 5, en.y - 10, 10, en.h + 10);
        } else if (en.type === 'drone') {
            ctx.fillStyle = "#9c27b0"; ctx.beginPath(); ctx.arc(en.x + en.w/2, en.y + en.h/2, en.w/2, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#ffeb3b"; ctx.beginPath(); ctx.arc(en.x + en.w/2, en.y + en.h/2, 6, 0, Math.PI*2); ctx.fill();
        } else if (en.type === 'sam') {
            ctx.fillStyle = "#37474f"; ctx.fillRect(en.x, en.y, en.w, en.h);
            ctx.fillStyle = "#ff9800"; ctx.fillRect(en.x + 4, en.y - 15, en.w - 8, 15);
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(en.x, en.y + en.h); ctx.lineTo(en.x + en.w/2, en.y + en.h + 18); ctx.lineTo(en.x + en.w, en.y + en.h); ctx.fill();
        }
    });

    projectiles.forEach(p => { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); });
    bombs.forEach(b => {
        const t = 1 - (b.timer/CONFIG.bombFallDuration);
        const size = 22*(1-t) + 8*t;
        ctx.fillStyle = "#333"; ctx.beginPath(); ctx.arc(b.x, b.y, size, 0, Math.PI*2); ctx.fill();
    });
    
    explosions.forEach(e => { ctx.strokeStyle = `rgba(255, 60, 0, ${e.life/25})`; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(e.x, e.y, e.currentR, 0, Math.PI*2); ctx.stroke(); });
    popups.forEach(p => { ctx.globalAlpha = p.life/35; ctx.fillStyle = p.color; ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center"; ctx.fillText(p.text, p.x, p.y); });
    ctx.globalAlpha = 1;

    // Player
    const bx = plane.x, by = plane.y;
    if (plane.dashTimer > 0) { ctx.globalAlpha = 0.5; ctx.fillStyle = "#03a9f4"; ctx.fillRect(bx-10, by, 80, 80); ctx.globalAlpha = 1; }
    ctx.fillStyle = "#455a64"; ctx.beginPath(); ctx.moveTo(bx+30, by-15); ctx.lineTo(bx+15, by); ctx.lineTo(bx+45, by); ctx.fill();
    ctx.fillStyle = "#607d8b"; ctx.fillRect(bx+15, by, 30, 60);
    ctx.fillStyle = "#37474f"; ctx.beginPath(); ctx.moveTo(bx+30, by+10); ctx.lineTo(bx-10, by+50); ctx.lineTo(bx+70, by+50); ctx.fill();

    // HUD
    ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, 0, canvas.width, 90);
    
    // Score & Phase
    ctx.fillStyle = "#fff"; ctx.font = "bold 22px 'Courier New'";
    ctx.fillText(`SCORE: ${score.toString().padStart(6, '0')}`, 20, 35);
    ctx.font = "bold 16px 'Courier New'";
    ctx.fillStyle = phase >= 4 ? "#ff1744" : (phase === 3 ? "#ff9800" : "#4caf50");
    ctx.fillText(`THREAT: PHASE ${phase} - ${phaseName}`, 20, 60);

    // Gun Heat Bar
    ctx.fillStyle = "#333"; ctx.fillRect(350, 20, 180, 15);
    let heatCol = gunOverheated ? "#d32f2f" : (gunHeat > 75 ? "#ff9800" : "#4caf50");
    ctx.fillStyle = heatCol; ctx.fillRect(350, 20, 180 * (gunHeat/100), 15);
    ctx.font = "10px sans-serif"; ctx.fillStyle = "#fff"; ctx.fillText(gunOverheated ? "M61 VULCAN LOCKED" : "M61 VULCAN THERMALS", 350, 48);

    // Missile HUD
    const now = Date.now();
    const missileReady = Math.min((now - lastMissileTime) / CONFIG.missileCooldown, 1);
    ctx.fillStyle = "#333"; ctx.fillRect(canvas.width - 200, 20, 180, 15);
    ctx.fillStyle = missileReady === 1 ? "#00e5ff" : "#546e7a"; ctx.fillRect(canvas.width - 200, 20, 180 * missileReady, 15);
    ctx.fillStyle = "#fff"; ctx.fillText("AIM-9 SIDEWINDER", canvas.width - 200, 48);
}

function gameOver() { if (devMode) return; gameRunning = false; alert(`AIRCRAFT DESTROYED\nFinal Score: ${score}\nPhase Reached: ${phase} - ${phaseName}`); location.reload(); }
function loop() { update(); draw(); requestAnimationFrame(loop); }

window.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyP') devMode = !devMode; });
window.addEventListener('keyup', e => keys[e.code] = false);
loop();
</script>
</body>
