<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canyon Runner - Precision Control</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        #hud { position: absolute; right: 20px; top: 20px; z-index: 50; color: #ffff00; text-align: right; pointer-events: none; }
        .val { font-size: 32px; font-weight: bold; color: #fff; text-shadow: 0 0 10px #ffff00; }
        .label { font-size: 10px; text-transform: uppercase; margin-top: 10px; }
        .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; color: #ffff00; z-index: 100; text-align: center; }
        .menu-row { display: flex; gap: 10px; margin-bottom: 20px; }
        button { background: #000; border: 2px solid #ffff00; color: #ffff00; padding: 12px 24px; cursor: pointer; font-family: inherit; font-weight: bold; }
        button:hover, .selected { background: #ffff00; color: #000; }
    </style>
</head>
<body>

<div id="ui-start" class="overlay">
    <h1 style="letter-spacing: 10px;">CANYON_OMNI</h1>
    <div class="menu-row">
        <button id="btn-mouse" class="selected" onclick="setControls('mouse')">MOUSE</button>
        <button id="btn-keys" onclick="setControls('keys')">KEYS</button>
        <button id="btn-pad" onclick="setControls('pad')">GAMEPAD</button>
    </div>
    <button onclick="initGame()" style="width: 200px;">START_SYNC</button>
</div>

<div id="ui-death" class="overlay" style="display:none">
    <h1 id="death-msg" style="color: #ff0000;">SIGNAL_LOST</h1>
    <button onclick="initGame()">RETRY</button>
</div>

<div id="hud">
    <div class="label">STABILITY</div>
    <div id="timer-val" class="val">15</div>
    <div class="label">GATES</div>
    <div id="score-val" class="val">0</div>
</div>

<canvas id="g"></canvas>

<script>
    const canvas = document.getElementById('g');
    const ctx = canvas.getContext('2d');

    let state = {
        active: false,
        inputType: 'mouse',
        player: { x: 0, y: 0, vx: 0, vy: 0 },
        nodes: [],
        npcs: [],
        score: 0,
        timeLeft: 15,
        mouse: { x: 0, y: 0 },
        keys: {},
        nextGateY: -2500
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e => {
        state.mouse.x = e.clientX;
        state.mouse.y = e.clientY;
    });
    window.addEventListener('keydown', e => state.keys[e.code] = true);
    window.addEventListener('keyup', e => state.keys[e.code] = false);

    resize();

    function setControls(type) {
        state.inputType = type;
        ['mouse', 'keys', 'pad'].forEach(t => {
            document.getElementById('btn-' + t).className = type === t ? 'selected' : '';
        });
    }

    function addNode() {
        const last = state.nodes[state.nodes.length - 1] || { y: 200, x: canvas.width / 2, w: 450 };
        state.nodes.push({
            y: last.y - 200,
            x: last.x + (Math.random() - 0.5) * 160,
            w: Math.max(260, Math.min(750, last.w + (Math.random() - 0.5) * 110))
        });
    }

    function initGame() {
        document.querySelectorAll('.overlay').forEach(el => el.style.display = 'none');
        state.active = true;
        state.player = { x: canvas.width / 2, y: 0, vx: 0, vy: 0 };
        state.score = 0;
        state.timeLeft = 15;
        state.nextGateY = -2500;
        state.nodes = [];
        state.npcs = [];
        for (let i = 0; i < 50; i++) addNode();
        loop();
    }

    function getHall(y) {
        for (let i = 0; i < state.nodes.length - 1; i++) {
            let n1 = state.nodes[i];
            let n2 = state.nodes[i + 1];
            if (y <= n1.y && y >= n2.y) {
                let p = (y - n1.y) / (n2.y - n1.y);
                return { x: n1.x + (n2.x - n1.x) * p, w: n1.w + (n2.w - n1.w) * p };
            }
        }
        return { x: canvas.width / 2, w: 450 };
    }

    function handleInput() {
        let ax = 0, ay = 0;

        if (state.inputType === 'mouse') {
            // Find relative position to player in screen space
            const screenPlayerY = canvas.height * 0.7; // This is where the player is drawn
            const dx = state.mouse.x - state.player.x;
            const dy = state.mouse.y - screenPlayerY;
            
            // Apply deadzone and proportional speed
            if (Math.abs(dx) > 10) ax = dx * 0.05;
            if (Math.abs(dy) > 10) ay = dy * 0.05;
            
            // Cap speed
            ax = Math.max(-10, Math.min(10, ax));
            ay = Math.max(-12, Math.min(12, ay));
            
            state.player.vx = ax;
            state.player.vy = ay;
        } else if (state.inputType === 'keys') {
            if (state.keys['ArrowLeft'] || state.keys['KeyA']) ax = -9;
            if (state.keys['ArrowRight'] || state.keys['KeyD']) ax = 9;
            if (state.keys['ArrowUp'] || state.keys['KeyW']) ay = -12;
            if (state.keys['ArrowDown'] || state.keys['KeyS']) ay = 6;
            state.player.vx = ax;
            state.player.vy = ay;
        } else if (state.inputType === 'pad') {
            const gps = navigator.getGamepads();
            if (gps[0]) {
                state.player.vx = gps[0].axes[0] * 10;
                state.player.vy = gps[0].axes[1] * 12;
            }
        }

        state.player.x += state.player.vx;
        state.player.y += state.player.vy;
    }

    function loop() {
        if (!state.active) return;

        state.timeLeft -= 1/60;
        handleInput();

        let hall = getHall(state.player.y);
        let limit = (hall.w / 2) - 15;
        state.player.x = Math.max(hall.x - limit, Math.min(hall.x + limit, state.player.x));

        if (state.nodes[state.nodes.length - 1].y > state.player.y - 3000) addNode();
        if (state.nodes[0].y > state.player.y + 1500) state.nodes.shift();

        if (state.player.y < state.nextGateY) {
            state.score++;
            state.timeLeft = 15;
            state.nextGateY -= 3000;
        }

        if (Math.random() < 0.05) {
            let spawnY = state.player.y - 1500;
            let h = getHall(spawnY);
            state.npcs.push({ x: h.x + (Math.random()-0.5)*h.w, y: spawnY, speed: 2 + Math.random()*4 });
        }

        state.npcs.forEach((n, i) => {
            n.y += n.speed;
            if (Math.hypot(n.x - state.player.x, n.y - state.player.y) < 25) die("COLLISION");
            if (n.y > state.player.y + 1200) state.npcs.splice(i, 1);
        });

        if (state.timeLeft <= 0) die("STABILITY_LOST");

        document.getElementById('timer-val').innerText = Math.max(0, Math.ceil(state.timeLeft));
        document.getElementById('score-val').innerText = state.score;

        draw();
        requestAnimationFrame(loop);
    }

    function die(m) {
        state.active = false;
        document.getElementById('death-msg').innerText = m;
        document.getElementById('ui-death').style.display = 'flex';
    }

    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const viewY = state.player.y - (canvas.height * 0.7);
        ctx.save();
        ctx.translate(0, -viewY);

        // Gate
        let gh = getHall(state.nextGateY);
        ctx.strokeStyle = '#0f0'; ctx.lineWidth = 12; ctx.shadowBlur = 20; ctx.shadowColor = '#0f0';
        ctx.beginPath(); ctx.moveTo(gh.x - gh.w/2, state.nextGateY); ctx.lineTo(gh.x + gh.w/2, state.nextGateY); ctx.stroke();

        // Walls
        ctx.strokeStyle = '#ff0'; ctx.lineWidth = 4; ctx.shadowBlur = 15; ctx.shadowColor = '#ff0';
        ctx.beginPath(); state.nodes.forEach(n => ctx.lineTo(n.x - n.w/2, n.y)); ctx.stroke();
        ctx.beginPath(); state.nodes.forEach(n => ctx.lineTo(n.x + n.w/2, n.y)); ctx.stroke();

        // NPCs
        ctx.shadowBlur = 10; ctx.shadowColor = '#f00'; ctx.fillStyle = '#f00';
        state.npcs.forEach(n => {
            ctx.beginPath(); ctx.arc(n.x, n.y, 10, 0, 7); ctx.fill();
        });

        // Player
        ctx.shadowBlur = 25; ctx.shadowColor = '#0ff'; ctx.fillStyle = '#0ff';
        ctx.beginPath(); ctx.arc(state.player.x, state.player.y, 14, 0, 7); ctx.fill();

        ctx.restore();
    }
</script>
</body>
</html>
