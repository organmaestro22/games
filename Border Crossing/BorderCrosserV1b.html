<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infiltrator: Infinite Ascent</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #050508;
            font-family: 'Segoe UI', sans-serif;
        }
        canvas { display: block; }
        
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; color: white; text-align: center;
            z-index: 100; background: rgba(5, 5, 8, 0.95);
        }

        #game-over-screen { display: none; background: rgba(20, 0, 0, 0.98); }

        /* HUD */
        #hud {
            position: absolute; top: 20px; left: 20px;
            color: #fff; pointer-events: none; z-index: 10;
        }
        .stat-box {
            background: rgba(0, 0, 0, 0.8); padding: 10px 20px;
            border-left: 4px solid #2ecc71; margin-bottom: 10px;
        }
        .label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 2px; }
        .value { font-size: 24px; font-weight: bold; }

        /* DEV OVERLAY */
        #dev-overlay {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.7); border: 1px solid #ffcc00;
            color: #ffcc00; font-family: 'Courier New', Courier, monospace;
            padding: 10px; font-size: 12px; display: none; pointer-events: none;
            z-index: 100; text-align: left; line-height: 1.5;
        }

        h1 { font-size: 60px; margin: 0; letter-spacing: 8px; text-transform: uppercase; }
        .red-text { color: #bc4749; }
        .green-text { color: #2ecc71; }
        
        button {
            background: transparent; border: 2px solid #fff; color: #fff;
            padding: 15px 40px; font-size: 18px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 4px; margin-top: 20px;
        }
        button:hover { background: #fff; color: #000; }
    </style>
</head>
<body>

<div id="welcome-screen" class="overlay">
    <h1 class="green-text">INFINITE NORTH</h1>
    <p style="color: #aaa;">Gaps become scarce. Patrols become relentless.</p>
    <button onclick="startGame()">Begin Infiltration</button>
</div>

<div id="game-over-screen" class="overlay">
    <h1 class="red-text">TERMINATED</h1>
    <div style="margin: 20px 0;">
        <div class="label">Total Distance</div>
        <div id="final-dist" class="value" style="font-size: 40px;">0m</div>
        <div class="label" style="margin-top: 10px;">Walls Breached</div>
        <div id="final-walls" class="value">0</div>
    </div>
    <button onclick="resetGame()">Re-Deploy</button>
</div>

<div id="hud">
    <div class="stat-box"><div class="label">Distance</div><div id="dist-val" class="value">0m</div></div>
    <div class="stat-box"><div class="label">Walls</div><div id="walls-val" class="value">0</div></div>
</div>

<div id="dev-overlay">
    <strong>[ DEV_LOG ]</strong><br>
    Diff Mult: <span id="dev-diff">1.0</span><br>
    Gap Prob: <span id="dev-prob">0.0</span><br>
    Guard Speed Range: <span id="dev-speed">0 - 0</span><br>
    Guard Hitbox: <span id="dev-hitbox">0</span><br>
    Entities: <span id="dev-entities">0</span>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    /**
     * TUNABLE CONFIGURATION
     */
    const CONFIG = {
        SHOW_DEV_OVERLAY: true, // Toggle this for telemetry
        PLAYER: { speed: 7.5, radius: 10, color: '#2ecc71' },
        WORLD: {
            wallHeight: 24,
            gapWidth: 105,
            wallSpacing: 1300,
            renderDistance: 4500,
            cleanupDistance: 2500,
            initialGapProb: 0.5,
            minGapProb: 0.1,
            gapDecayRate: 0.00003
        },
        DIFFICULTY: {
            rampRate: 0.0001,
            baseGuardSpeed: 4.2,
            baseGuardCount: 18, 
            baseHitRadius: 75,
            baseGlowRadius: 125
        }
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const welcomeScreen = document.getElementById('welcome-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const devOverlay = document.getElementById('dev-overlay');

    let gameActive = false;
    let scoreDistance = 0;
    let wallsBreached = 0;
    let frameCount = 0;
    let nextWallY = -1200; 
    const keys = {};

    const camera = { x: 0, y: 0 };
    let walls = [];
    let guards = [];

    const player = { x: 0, y: 0, prevX: 0, prevY: 0, ...CONFIG.PLAYER };

    function init() {
        resize();
        if (CONFIG.SHOW_DEV_OVERLAY) devOverlay.style.display = 'block';
        window.addEventListener('resize', resize);
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function startGame() {
        welcomeScreen.style.display = 'none';
        resetGame();
    }

    function resetGame() {
        scoreDistance = 0;
        wallsBreached = 0;
        nextWallY = -1200;
        walls = [];
        guards = [];
        player.x = canvas.width / 2;
        player.y = 600;
        camera.y = player.y - canvas.height / 2;
        
        gameOverScreen.style.display = 'none';
        gameActive = true;
        updateHUD();
        requestAnimationFrame(loop);
    }

    function updateHUD() {
        document.getElementById('dist-val').innerText = Math.floor(scoreDistance) + "m";
        document.getElementById('walls-val').innerText = wallsBreached;

        if (CONFIG.SHOW_DEV_OVERLAY) {
            const distFactor = Math.abs(player.y);
            const diffMult = 1 + (distFactor * CONFIG.DIFFICULTY.rampRate);
            const currentGapProb = Math.max(CONFIG.WORLD.minGapProb, CONFIG.WORLD.initialGapProb - (distFactor * CONFIG.WORLD.gapDecayRate));
            
            document.getElementById('dev-diff').innerText = diffMult.toFixed(3);
            document.getElementById('dev-prob').innerText = (currentGapProb * 100).toFixed(1) + "%";
            document.getElementById('dev-speed').innerText = 
                (CONFIG.DIFFICULTY.baseGuardSpeed * diffMult).toFixed(1) + " - " + 
                ((CONFIG.DIFFICULTY.baseGuardSpeed + 3.5) * diffMult).toFixed(1);
            document.getElementById('dev-hitbox').innerText = (CONFIG.DIFFICULTY.baseHitRadius + (diffMult * 1.5)).toFixed(1);
            document.getElementById('dev-entities').innerText = walls.length + guards.length;
        }
    }

    function spawnProceduralContent() {
        while (nextWallY > player.y - CONFIG.WORLD.renderDistance) {
            const distFactor = Math.abs(nextWallY);
            const diffMult = 1 + (distFactor * CONFIG.DIFFICULTY.rampRate);
            const currentGapProb = Math.max(CONFIG.WORLD.minGapProb, CONFIG.WORLD.initialGapProb - (distFactor * CONFIG.WORLD.gapDecayRate));

            const newWall = { y: nextWallY, gaps: [], cleared: false };
            
            for (let x = player.x - 6000; x < player.x + 6000; x += 850) {
                if (Math.random() < currentGapProb) {
                    const gapX = x + Math.random() * 400;
                    newWall.gaps.push({ x: gapX, w: CONFIG.WORLD.gapWidth });
                }
            }
            
            if (newWall.gaps.length === 0) {
                newWall.gaps.push({ x: player.x + (Math.random() * 1000 - 500), w: CONFIG.WORLD.gapWidth });
            }

            walls.push(newWall);

            const guardCount = Math.floor(CONFIG.DIFFICULTY.baseGuardCount * diffMult);
            for (let i = 0; i < guardCount; i++) {
                guards.push({
                    x: player.x + (Math.random() - 0.5) * 8000,
                    y: nextWallY + (Math.random() * CONFIG.WORLD.wallSpacing),
                    speed: (CONFIG.DIFFICULTY.baseGuardSpeed + Math.random() * 3.5) * diffMult,
                    dir: Math.random() > 0.5 ? 1 : -1,
                    visualRadius: CONFIG.DIFFICULTY.baseGlowRadius + (diffMult * 1.5),
                    hitRadius: CONFIG.DIFFICULTY.baseHitRadius + (diffMult * 1.5)
                });
            }

            nextWallY -= CONFIG.WORLD.wallSpacing;
        }

        if (frameCount % 120 === 0) {
            walls = walls.filter(w => w.y < player.y + CONFIG.WORLD.cleanupDistance);
            guards = guards.filter(g => g.y < player.y + CONFIG.WORLD.cleanupDistance);
        }
    }

    function endGame() {
        gameActive = false;
        document.getElementById('final-dist').innerText = Math.floor(scoreDistance) + "m";
        document.getElementById('final-walls').innerText = wallsBreached;
        gameOverScreen.style.display = 'flex';
    }

    function loop() {
        if (!gameActive) return;

        player.prevX = player.x;
        player.prevY = player.y;

        if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
        if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
        if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
        if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;

        let currentDist = Math.max(0, (600 - player.y) / 10);
        if (currentDist > scoreDistance) {
            scoreDistance = currentDist;
        }
        
        // Update HUD every frame to ensure Dev telemetry is live
        updateHUD();

        spawnProceduralContent();

        walls.forEach(wall => {
            const wallTop = wall.y;
            const wallBot = wall.y + CONFIG.WORLD.wallHeight;
            if (player.y + player.radius > wallTop && player.y - player.radius < wallBot) {
                const inGap = wall.gaps.some(g => player.x > g.x && player.x < g.x + g.w);
                if (inGap) {
                    if (player.y < wallTop && !wall.cleared) {
                        wall.cleared = true;
                        wallsBreached++;
                    }
                } else {
                    if (player.prevY >= wallBot) player.y = wallBot + player.radius;
                    else if (player.prevY <= wallTop) player.y = wallTop - player.radius;
                }
            }
        });

        guards.forEach(g => {
            g.x += g.speed * g.dir;
            if (g.x < player.x - 4500) g.x += 9000;
            if (g.x > player.x + 4500) g.x -= 9000;

            const dist = Math.hypot(player.x - g.x, player.y - g.y);
            if (dist < g.hitRadius) endGame();
        });

        camera.x = player.x - canvas.width / 2;
        camera.y = player.y - canvas.height / 2;

        draw();
        frameCount++;
        requestAnimationFrame(loop);
    }

    function draw() {
        ctx.fillStyle = '#050508';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        // Grid
        ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
        for (let x = Math.floor(camera.x/500)*500; x < camera.x + canvas.width + 500; x += 500) {
            for (let y = Math.floor(camera.y/500)*500; y < camera.y + canvas.height + 500; y += 500) {
                ctx.fillRect(x, y, 2, 2);
            }
        }

        // Walls
        walls.forEach(wall => {
            ctx.fillStyle = wall.cleared ? '#1a3325' : '#15151b';
            let curX = camera.x - 3000;
            wall.gaps.forEach(g => {
                ctx.fillRect(curX, wall.y, g.x - curX, CONFIG.WORLD.wallHeight);
                curX = g.x + g.w;
            });
            ctx.fillRect(curX, wall.y, (camera.x + canvas.width + 3000) - curX, CONFIG.WORLD.wallHeight);
        });

        // Guards
        guards.forEach(g => {
            const glow = g.visualRadius + Math.sin(frameCount * 0.1) * 6;
            const grad = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, glow);
            grad.addColorStop(0, 'rgba(255, 30, 30, 0.4)');
            grad.addColorStop(0.7, 'rgba(255, 30, 30, 0.05)');
            grad.addColorStop(1, 'rgba(255, 30, 30, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(g.x, g.y, glow, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ff4d4d';
            ctx.beginPath();
            ctx.arc(g.x, g.y, 4, 0, Math.PI * 2);
            ctx.fill();
        });

        // Player
        ctx.shadowBlur = 15;
        ctx.shadowColor = player.color;
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
    }

    init();
</script>
</body>
</html>
